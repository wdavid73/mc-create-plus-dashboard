<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Create+ Dashboard — Iniciar sesión</title>
<style>
  :root {
    --bg: #0f1216;
    --panel: #171b21;
    --panel-border: #272c34;
    --text: #e7e9ec;
    --muted: #8b939f;
    --accent: #5fbf77;
    --accent-dim: #22382a;
    --danger: #d9664f;
    --ease-out: cubic-bezier(0.23, 1, 0.32, 1);
  }
  * { box-sizing: border-box; }
  @media (prefers-reduced-motion: reduce) {
    .login-card { animation: none !important; opacity: 1 !important; transform: none !important; }
  }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background:
      radial-gradient(circle at 18% 18%, rgba(95, 191, 119, 0.10), transparent 42%),
      radial-gradient(circle at 85% 75%, rgba(122, 167, 214, 0.08), transparent 45%),
      var(--bg);
    color: var(--text);
    line-height: 1.5;
  }
  .login-card {
    width: 100%;
    max-width: 360px;
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 14px;
    padding: 32px 30px 28px;
    box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.6);
    opacity: 0;
    transform: translateY(10px) scale(0.98);
    animation: card-in 420ms var(--ease-out) forwards;
  }
  @keyframes card-in {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }
  .brand {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 22px;
  }
  .brand-mark {
    width: 34px; height: 34px; border-radius: 8px;
    background: linear-gradient(145deg, var(--accent), #3f8c54);
    display: flex; align-items: center; justify-content: center;
    color: #0f1a12;
    flex-shrink: 0;
  }
  .brand-mark svg { width: 19px; height: 19px; }
  .brand h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .brand p { margin: 1px 0 0; font-size: 12.5px; color: var(--muted); }

  label { display: block; font-size: 12.5px; color: var(--muted); margin-bottom: 6px; margin-top: 16px; }
  label:first-of-type { margin-top: 0; }
  input {
    width: 100%;
    background: #0d1014;
    border: 1px solid var(--panel-border);
    color: var(--text);
    padding: 10px 12px;
    border-radius: 8px;
    font-size: 14px;
    transition: border-color 160ms ease, box-shadow 160ms ease;
  }
  input:focus {
    outline: none;
    border-color: var(--accent);
    box-shadow: 0 0 0 3px var(--accent-dim);
  }

  .submit-btn {
    width: 100%;
    margin-top: 22px;
    background: var(--accent);
    color: #0f1a12;
    border: 1px solid var(--accent);
    padding: 11px 16px;
    min-height: 44px;
    border-radius: 8px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 160ms var(--ease-out), filter 160ms ease;
  }
  .submit-btn:active { transform: scale(0.97); }
  @media (hover: hover) and (pointer: fine) {
    .submit-btn:hover { filter: brightness(1.08); }
  }

  .error-box {
    display: flex;
    align-items: center;
    gap: 8px;
    background: #2a1a17;
    border: 1px solid #4a2e2a;
    color: #e8a99a;
    padding: 9px 12px;
    border-radius: 8px;
    font-size: 13px;
    margin-top: 16px;
    opacity: 0;
    transform: translateY(-4px);
    animation: error-in 220ms var(--ease-out) forwards;
  }
  .error-box svg { width: 15px; height: 15px; flex-shrink: 0; color: var(--danger); }
  @keyframes error-in { to { opacity: 1; transform: translateY(0); } }

  .footnote {
    text-align: center;
    font-size: 11.5px;
    color: #7d8694;
    margin-top: 22px;
  }
</style>
</head>
<body>

<form class="login-card">
  <div class="brand">
    <span class="brand-mark">
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 7l8-4 8 4v10l-8 4-8-4z"/></svg>
    </span>
    <div>
      <h1>Create+ Dashboard</h1>
      <p>Gestión del servidor</p>
    </div>
  </div>

  <label for="username">Usuario</label>
  <input id="username" name="username" type="text" autocomplete="username" required>

  <label for="password">Contraseña</label>
  <input id="password" name="password" type="password" autocomplete="current-password" required>

  <!-- Estado de ejemplo: credenciales inválidas. Se muestra/oculta según la respuesta del backend. -->
  <div class="error-box">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v5M12 16h.01"/></svg>
    Usuario o contraseña incorrectos
  </div>

  <button class="submit-btn" type="submit">Iniciar sesión</button>

  <p class="footnote">Acceso restringido — servidor Create+</p>
</form>

</body>
</html>
